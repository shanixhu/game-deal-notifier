[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "game-deal-notifier"
version = "1.1.0"
description = "Curated Steam, Epic and GOG deal alerts for Discord"
requires-python = ">=3.11"
authors = [{ name = "Shanu" }]
license = { file = "LICENSE" }
readme = "README.md"
keywords = ["game-deals", "discord", "steam", "epic-games", "gog", "github-actions"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent"
]
dependencies = [
  "requests>=2.32,<3",
  "beautifulsoup4>=4.12,<5"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deal_scout = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[project.urls]
Homepage = "https://github.com/shanixhu/game-deal-notifier"
Issues = "https://github.com/shanixhu/game-deal-notifier/issues"


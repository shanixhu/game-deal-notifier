[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-game-deal-scout"
version = "1.0.0"
description = "Personal Steam, Epic, and GOG deal alerts for Discord"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "beautifulsoup4>=4.12,<5"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deal_scout = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
